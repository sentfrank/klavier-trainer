name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  # Strato: w-esel.de/klavier-trainer per SFTP
  strato:
    needs: build
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.STRATO_SFTP_HOST || 'ssh.strato.de' }}
      USER: ${{ secrets.STRATO_SFTP_USER }}
      PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
      TARGET: ${{ vars.STRATO_TARGET_DIR || 'w-esel/klavier-trainer' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: github-pages }
      - run: mkdir dist && tar -xf artifact.tar -C dist
      - name: Upload via SFTP
        if: env.USER != ''
        run: |
          sudo apt-get install -y lftp >/dev/null
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "set sftp:auto-confirm yes; mkdir -pf $TARGET; mirror -R --delete --verbose dist/ $TARGET/; bye"
      - name: Hinweis
        if: env.USER == ''
        run: echo "::warning::STRATO_SFTP_USER / STRATO_SFTP_PASSWORD fehlen – Strato-Upload übersprungen."

  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
